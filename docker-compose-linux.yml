version: "3.8"
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - /srv/music:/media/music:ro
      - /srv/music-server/jellyfin/config:/config
      - /srv/music-server/jellyfin/cache:/cache
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - ND_LOGLEVEL=info
      - ND_SCANINTERVAL=1m
    ports:
      - "4533:4533"
    volumes:
      - /srv/music:/data/music:ro
      - /srv/music-server/navidrome/data:/data/db
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/music-server/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/music-server/caddy/data:/data
      - /srv/music-server/caddy/config:/config
    restart: unless-stopped